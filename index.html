<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">

  <title>AURCUS MARKET</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="hero">

    <div class="hero-copy">

      <p class="eyebrow">
        AURCUS ONLINE
      </p>

      <h2>
        AURCUS<br>
        MARKET
      </h2>

<p class="sub">
        Official accessory marketplace by Oren
      </p>

      <div class="hero-line"></div>

      </div>

    <div class="hero-actions">

      <button
        class="cart-button currency-button"
        id="currency-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Ganti tampilan mata uang"
      >
        <span id="currency-toggle-label">Rp</span>
      </button>

      <button
        class="cart-button currency-button"
        id="lang-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Ganti bahasa"
      >
        EN
      </button>

      <button
        class="cart-button"
        id="cart-btn"
        type="button"
        aria-label="Buka keranjang"
      >
        <span>Cart</span>
        <b id="cart-count">0</b>
      </button>

    </div>

  </header>


  <section class="status-card">

    <div>

      <span class="label">
        INVENTORY
      </span>

      <strong id="sync-status">
        Memuat...
      </strong>

    </div>

    <div class="updated">

      <span class="label">
        LAST UPDATED
      </span>

      <strong id="meta">
        —
      </strong>

    </div>

  </section>


  <section class="filters">

    <input
      id="q"
      type="search"
      placeholder="Search accessories..."
      autocomplete="off"
    >

    <div class="filter-row">

      <select
        id="level-filter"
        aria-label="Filter level"
      >
        <option value="all">
          Semua Level
        </option>
      </select>

      <select
        id="type-filter"
        aria-label="Filter tipe"
      >
        <option value="all">
          Semua Tipe
        </option>
      </select>

      <select
        id="variant-filter"
        aria-label="Filter varian"
      >
        <option value="all">
          Semua Varian
        </option>
      </select>

    </div>

    <button
      class="reset"
      id="reset-btn"
      type="button"
    >
      Reset Filter
    </button>

  </section>


  <div class="catalog-head">

    <span id="result-info">
      Memuat katalog...
    </span>

  </div>


  <main
    id="catalog"
    class="catalog"
  ></main>


  <div
    id="empty"
    class="empty"
    hidden
  >

    <h2>
      Tidak ada item
    </h2>

    <p>
      Coba ubah pencarian atau filter.
    </p>

  </div>
</div>


<aside
  id="cart-sheet"
  class="cart-sheet"
  aria-hidden="true"
>

  <div
    class="cart-backdrop"
    id="cart-backdrop"
  ></div>


  <div class="cart-panel">

    <header>

      <div>

        <p class="eyebrow">
          ORDER
        </p>

        <h2>
          Keranjang
        </h2>

      </div>

      <button
        id="close-cart"
        class="icon-button"
        type="button"
        aria-label="Tutup"
      >
        ×
      </button>

    </header>


    <div
      id="cart-items"
      class="cart-items"
    ></div>


    <div class="cart-footer">

      <div class="total">

        <span>
          Total
        </span>

        <strong id="cart-total">
          Rp 0
        </strong>

      </div>

      <div class="payment-support">
        <span class="payment-support-label">Supported Payment</span>
        <span class="payment-support-list">Dana, USDT/Crypto, GCash (via GCrypto), Paypal</span>
      </div>

      <button
        id="checkout-btn"
        class="checkout"
        type="button"
      >
        Checkout via WhatsApp
      </button>
      <button
        id="checkout-btn"
        class="checkout"
        type="button"
      >
        Checkout via WhatsApp
      </button>
      
      <button
        id="checkout-btn"
        class="checkout"
        type="button"
      >
        Checkout via WhatsApp
      </button>

      <button
        id="checkout-telegram-btn"
        class="checkout telegram"
        type="button"
      >
        Checkout via Telegram
      </button>

      <button
        id="clear-cart"
        class="secondary"
        type="button"
      >
        Kosongkan Keranjang
      </button>

    </div>

  </div>

</aside>


<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>


<script src="app.js"></script>

</body>
</html>
