<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">

  <title>AURCUS MARKET — Accessories</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="hero">

    <div>
      <p class="eyebrow">AURCUS ONLINE</p>

      <h1>AURCUS MARKET</h1>

      <p class="sub">
        Accessory marketplace
      </p>
    </div>

    <button
      class="cart-button"
      id="cart-btn"
      type="button"
      aria-label="Buka keranjang"
    >
      <span>Cart</span>
      <b id="cart-count">0</b>
    </button>

  </header>


  <!-- INVENTORY STATUS -->
  <section class="status-card">

    <div>
      <span class="label">INVENTORY</span>

      <strong id="sync-status">
        Memuat...
      </strong>
    </div>

    <div class="updated">

      <span class="label">
        LAST UPDATED
      </span>

      <strong id="meta">
        —
      </strong>

    </div>

  </section>


  <!-- FILTER -->
  <section class="filters">

    <input
      id="q"
      type="search"
      placeholder="Cari accessory..."
      autocomplete="off"
    >

    <div class="filter-row">

      <select
        id="level-filter"
        aria-label="Filter level"
      >
        <option value="all">
          Semua Level
        </option>
      </select>

      <select
        id="type-filter"
        aria-label="Filter tipe"
      >
        <option value="all">
          Semua Tipe
        </option>
      </select>

      <select
        id="variant-filter"
        aria-label="Filter varian"
      >
        <option value="all">
          Semua Varian
        </option>
      </select>

    </div>

    <button
      class="reset"
      id="reset-btn"
      type="button"
    >
      Reset Filter
    </button>

  </section>


  <!-- RESULT INFO -->
  <div class="catalog-head">

    <span id="result-info">
      Memuat katalog...
    </span>

  </div>


  <!-- CATALOG -->
  <main
    id="catalog"
    class="catalog"
  ></main>


  <!-- EMPTY STATE -->
  <div
    id="empty"
    class="empty"
    hidden
  >

    <h2>
      Tidak ada item
    </h2>

    <p>
      Coba ubah pencarian atau filter.
    </p>

  </div>


  <!-- MANUAL JSON LOAD -->
  <footer>

    <button
      class="secondary"
      id="load-btn"
      type="button"
    >
      Muat accessories.json
    </button>

    <input
      id="load-input"
      type="file"
      accept="application/json,.json"
      hidden
    >

  </footer>

</div>


<!-- CART -->
<aside
  id="cart-sheet"
  class="cart-sheet"
  aria-hidden="true"
>

  <div
    class="cart-backdrop"
    id="cart-backdrop"
  ></div>


  <div class="cart-panel">

    <header>

      <div>

        <p class="eyebrow">
          ORDER
        </p>

        <h2>
          Keranjang
        </h2>

      </div>

      <button
        id="close-cart"
        class="icon-button"
        type="button"
        aria-label="Tutup"
      >
        ×
      </button>

    </header>


    <!-- CART ITEMS -->
    <div
      id="cart-items"
      class="cart-items"
    ></div>


    <!-- CART FOOTER -->
    <div class="cart-footer">

      <div class="total">

        <span>
          Estimasi Total
        </span>

        <strong id="cart-total">
          Rp 0
        </strong>

      </div>


      <button
        id="checkout-btn"
        class="checkout"
        type="button"
      >
        Checkout via WhatsApp
      </button>


      <button
        id="clear-cart"
        class="secondary"
        type="button"
      >
        Kosongkan Keranjang
      </button>

    </div>

  </div>

</aside>


<!-- TOAST -->
<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>


<script src="app.js"></script>

</body>
</html>
