<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0c14">

  <title>AURCUS MARKET</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="hero">

    <div class="hero-copy">
      <p class="eyebrow">Aurcus Online</p>
      <h2>Aurcus Market</h2>
      <p class="sub">Accessory ledger by Oren</p>
    </div>

    <div class="hero-actions">

      <button
        class="cart-button icon-toggle"
        id="theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Ganti tema gelap/terang"
      >
        <span id="theme-toggle-label">🌙</span>
      </button>

      <button
        class="cart-button icon-toggle"
        id="lang-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Ganti bahasa"
      >
        EN
      </button>

      <button
        class="cart-button"
        id="cart-btn"
        type="button"
        aria-label="Buka keranjang"
      >
        <span>Cart</span>
        <b id="cart-count">0</b>
      </button>

    </div>

  </header>


  <section class="status-card">
    <div>
      <span class="label">Inventory</span>
      <strong id="sync-status">Memuat...</strong>
    </div>
    <div class="updated">
      <span class="label">Update</span>
      <strong id="meta">—</strong>
    </div>
  </section>


  <section class="filters">

    <input
      id="q"
      type="search"
      placeholder="Cari accessories..."
      autocomplete="off"
    >

    <div class="filter-row">

      <select id="level-filter" aria-label="Filter level">
        <option value="all">Semua Level</option>
      </select>

      <select id="type-filter" aria-label="Filter tipe">
        <option value="all">Semua Tipe</option>
      </select>

      <select id="variant-filter" aria-label="Filter varian">
        <option value="all">Semua Varian</option>
      </select>

    </div>

    <button class="reset" id="reset-btn" type="button">Reset Filter</button>

  </section>


  <div class="catalog-head">
    <span id="result-info">Memuat katalog...</span>
  </div>


  <main id="catalog" class="catalog"></main>


  <div id="empty" class="empty" hidden>
    <h2>Tidak ada item</h2>
    <p>Coba ubah pencarian atau filter.</p>
  </div>

</div>


<aside id="cart-sheet" class="cart-sheet" aria-hidden="true">

  <div class="cart-backdrop" id="cart-backdrop"></div>

  <div class="cart-panel">

    <header>
      <div>
        <p class="eyebrow">Order</p>
        <h2>Keranjang</h2>
      </div>
      <button id="close-cart" class="icon-button" type="button" aria-label="Tutup">×</button>
    </header>

    <div id="cart-items" class="cart-items"></div>

    <div class="cart-footer">

      <div class="total">
        <span>Harga</span>
        <strong id="cart-total">Chat dulu ya</strong>
      </div>

      <div class="payment-support">
        <span class="payment-support-label">Supported Payment</span>
        <span class="payment-support-list">Dana, USDT/Crypto, GCash (via GCrypto), Paypal</span>
      </div>

      <button id="checkout-btn" class="checkout" type="button">Checkout via WhatsApp</button>
      <button id="checkout-telegram-btn" class="checkout telegram" type="button">Checkout via Telegram</button>
      <button id="clear-cart" class="secondary" type="button">Kosongkan Keranjang</button>

    </div>

  </div>

</aside>


<div id="toast" class="toast" role="status" aria-live="polite"></div>


<script src="app.js"></script>

</body>
</html>
